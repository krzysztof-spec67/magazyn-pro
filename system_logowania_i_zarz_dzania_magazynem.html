                                        <tbody className="divide-y divide-slate-100">
                                            {assignments
                                                .filter(a => a.orderCode === inspectingOrder.id)
                                                .filter(a => a.productName.toLowerCase().includes(inspectSearch.toLowerCase()) || a.ean.includes(inspectSearch))
                                                .length > 0 ? (
                                                    assignments
                                                        .filter(a => a.orderCode === inspectingOrder.id)
                                                        .filter(a => a.productName.toLowerCase().includes(inspectSearch.toLowerCase()) || a.ean.includes(inspectSearch))
                                                        .map(a => (
                                                            <tr key={a.id} className="hover:bg-slate-50">
                                                                <td className="py-3 px-4 font-mono font-bold text-slate-800">{a.ean}</td>
                                                                <td className="py-3 px-4 font-bold text-slate-900">{a.productName}</td>
                                                                <td className="py-3 px-4 text-center font-black text-indigo-600">
                                                                    {a.quantity} {a.unit}
                                                                </td>
                                                                <td className="py-3 px-4 text-right font-medium">{a.price ? a.price.toFixed(2) + ' zł' : '-'}</td>
                                                                <td className="py-3 px-4 text-right font-bold text-emerald-700">
                                                                    {a.price ? (a.price * a.quantity).toFixed(2) + ' zł' : '-'}
                                                                </td>
                                                                <td className="py-3 px-4 text-slate-400">{a.timestamp}</td>
                                                                <td className="py-3 px-4 text-right">
                                                                    <button
                                                                        onClick={() => setDeleteScanConfirmTarget(a)}
                                                                        className="text-rose-600 hover:text-rose-800 font-bold hover:underline"
                                                                    >
                                                                        Usuń ze zlecenia
                                                                    </button>
                                                                </td>
                                                            </tr>
                                                        ))
                                                ) : (
                                                    <tr>
                                                        <td colSpan="7" className="py-12 text-center text-slate-400">
                                                            <i className="fa-solid fa-box-open text-3xl mb-2 block"></i>
                                                            Brak zeskanowanych pozycji w tym zleceniu.
                                                        </td>
                                                    </tr>
                                                )}
                                        </tbody>
                                    </table>
                                </div>

                                <div className="pt-4 border-t border-slate-200 text-right">
                                    <button
                                        onClick={() => setInspectingOrder(null)}
                                        className="px-5 py-2.5 bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs rounded-xl"
                                    >
                                        Zamknij Widok Zlecenia
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {showPinModal && (
                        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl border border-slate-100 space-y-4">
                                <div className="text-center">
                                    <div className="w-14 h-14 bg-amber-100 text-amber-600 rounded-2xl flex items-center justify-center mx-auto mb-2 text-2xl">
                                        <i className="fa-solid fa-lock"></i>
                                    </div>
                                    <h3 className="font-bold text-slate-900 text-lg">Dostęp do Panelu Szefa</h3>
                                    <p className="text-xs text-slate-500">Wpisz dedykowany PIN kierownika.</p>
                                </div>

                                <form onSubmit={handlePinSubmit} className="space-y-4">
                                    <input
                                        type="password"
                                        maxLength="10"
                                        value={pinInput}
                                        onChange={(e) => setPinInput(e.target.value)}
                                        placeholder="Wpisz PIN Szefa"
                                        autoFocus
                                        className="w-full text-center text-2xl tracking-widest font-mono font-bold py-3 bg-slate-50 border-2 border-slate-300 rounded-xl focus:border-amber-500 focus:outline-none"
                                    />
                                    {pinError && <p className="text-xs text-rose-600 font-bold text-center">{pinError}</p>}

                                    <div className="flex space-x-2 pt-2">
                                        <button
                                            type="button"
                                            onClick={() => setShowPinModal(false)}
                                            className="w-1/2 py-2.5 rounded-xl border border-slate-300 text-xs font-semibold text-slate-600"
                                        >
                                            Anuluj
                                        </button>
                                        <button
                                            type="submit"
                                            className="w-1/2 py-2.5 rounded-xl bg-amber-600 hover:bg-amber-500 text-white font-bold text-xs shadow-md"
                                        >
                                            Zaloguj się
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {showChangePinModal && (
                        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl border border-slate-100 space-y-4">
                                <h3 className="font-bold text-slate-900 text-base border-b pb-2">
                                    Zmiana PIN-u: {pinTypeToEdit === 'app' ? 'Dostęp do Strony' : 'Panel Szefa'}
                                </h3>

                                <form onSubmit={handleChangePinSubmit} className="space-y-3">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Obecny PIN</label>
                                        <input
                                            type="password"
                                            required
                                            value={pinForm.oldPin}
                                            onChange={(e) => setPinForm({ ...pinForm, oldPin: e.target.value })}
                                            className="w-full text-center font-mono font-bold py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Nowy PIN (min. 4 cyfry)</label>
                                        <input
                                            type="password"
                                            required
                                            value={pinForm.newPin}
                                            onChange={(e) => setPinForm({ ...pinForm, newPin: e.target.value })}
                                            className="w-full text-center font-mono font-bold py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Powtórz Nowy PIN</label>
                                        <input
                                            type="password"
                                            required
                                            value={pinForm.confirmPin}
                                            onChange={(e) => setPinForm({ ...pinForm, confirmPin: e.target.value })}
                                            className="w-full text-center font-mono font-bold py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm"
                                        />
                                    </div>

                                    {changePinError && <p className="text-xs text-rose-600 font-bold">{changePinError}</p>}

                                    <div className="flex space-x-2 pt-2 border-t">
                                        <button
                                            type="button"
                                            onClick={() => setShowChangePinModal(false)}
                                            className="w-1/2 py-2 rounded-xl border text-xs font-bold text-slate-600"
                                        >
                                            Anuluj
                                        </button>
                                        <button
                                            type="submit"
                                            className={`w-1/2 py-2 rounded-xl text-white font-bold text-xs ${
                                                pinTypeToEdit === 'app' ? 'bg-indigo-600 hover:bg-indigo-500' : 'bg-amber-600 hover:bg-amber-500'
                                            }`}
                                        >
                                            Zapisz Nowy PIN
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {showProductModal && (
                        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl border border-slate-100 max-h-[90vh] overflow-y-auto">
                                <div className="flex items-center justify-between border-b pb-3 mb-4">
                                    <h3 className="font-bold text-slate-900 text-base">
                                        {editingProduct ? 'Edytuj Produkt' : 'Dodaj Produkt do Magazynu'}
                                    </h3>
                                    <button onClick={() => setShowProductModal(false)} className="text-slate-400 hover:text-slate-600">
                                        <i className="fa-solid fa-xmark text-lg"></i>
                                    </button>
                                </div>

                                <form onSubmit={handleSaveProduct} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Nazwa Produktu</label>
                                        <input
                                            type="text"
                                            required
                                            value={formData.name}
                                            onChange={(e) => setFormData({ ...formData, name: e.target.value })}
                                            className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-xs font-semibold"
                                        />
                                    </div>

                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Kod EAN / SKU</label>
                                            <input
                                                type="text"
                                                required
                                                value={formData.ean}
                                                onChange={(e) => setFormData({ ...formData, ean: e.target.value })}
                                                className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-xs font-mono font-bold"
                                            />
                                        </div>

                                        <div>
                                            <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Kategoria</label>
                                            <input
                                                type="text"
                                                required
                                                value={formData.category}
                                                onChange={(e) => setFormData({ ...formData, category: e.target.value })}
                                                className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-xs font-semibold"
                                            />
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-4 gap-2">
                                        <div>
                                            <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Cena (zł)</label>
                                            <input
                                                type="number"
                                                step="0.01"
                                                min="0"
                                                value={formData.price}
                                                onChange={(e) => setFormData({ ...formData, price: parseFloat(e.target.value) || 0 })}
                                                className="w-full px-2 py-2 bg-slate-50 border border-slate-300 rounded-lg text-xs font-bold text-center"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Stan</label>
                                            <input
                                                type="number"
                                                min="0"
                                                value={formData.stock}
                                                onChange={(e) => setFormData({ ...formData, stock: parseInt(e.target.value) || 0 })}
                                                className="w-full px-2 py-2 bg-slate-50 border border-slate-300 rounded-lg text-xs font-bold text-center"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Min. Stan</label>
                                            <input
                                                type="number"
                                                min="0"
                                                value={formData.minStock}
                                                onChange={(e) => setFormData({ ...formData, minStock: parseInt(e.target.value) || 0 })}
                                                className="w-full px-2 py-2 bg-slate-50 border border-slate-300 rounded-lg text-xs font-bold text-center text-rose-600"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Jedn.</label>
                                            <select
                                                value={formData.unit}
                                                onChange={(e) => setFormData({ ...formData, unit: e.target.value })}
                                                className="w-full px-1 py-2 bg-slate-50 border border-slate-300 rounded-lg text-xs font-bold"
                                            >
                                                <option value="szt">szt</option>
                                                <option value="opk">opk</option>
                                                <option value="kg">kg</option>
                                                <option value="m">m</option>
                                                <option value="rolka">rolka</option>
                                            </select>
                                        </div>
                                    </div>

                                    {formData.ean && (
                                        <div className="bg-slate-50 p-2 rounded-xl text-center border border-slate-200">
                                            <BarcodeVisual value={formData.ean} width={1.8} height={38} fontSize={10} />
                                        </div>
                                    )}

                                    <div className="flex space-x-2 pt-3 border-t">
                                        <button
                                            type="button"
                                            onClick={() => setShowProductModal(false)}
                                            className="w-1/2 py-2.5 rounded-xl border border-slate-300 text-xs font-semibold text-slate-600"
                                        >
                                            Anuluj
                                        </button>
                                        <button
                                            type="submit"
                                            className="w-1/2 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs"
                                        >
                                            Zapisz Produkt
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {showNewOrderModal && (
                        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl border border-slate-100">
                                <h3 className="font-bold text-slate-900 text-base border-b pb-2 mb-3">Nowe Zlecenie</h3>
                                <form onSubmit={handleSaveNewOrder} className="space-y-3">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Kod Zlecenia</label>
                                        <input
                                            type="text"
                                            required
                                            value={newOrderData.id}
                                            onChange={(e) => setNewOrderData({ ...newOrderData, id: e.target.value })}
                                            placeholder="np. ZLEC-2026-004"
                                            className="w-full px-3 py-2 bg-slate-50 border rounded-lg text-xs font-mono font-bold uppercase"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Nazwa Zlecenia</label>
                                        <input
                                            type="text"
                                            required
                                            value={newOrderData.name}
                                            onChange={(e) => setNewOrderData({ ...newOrderData, name: e.target.value })}
                                            placeholder="np. Remont Magazynu A"
                                            className="w-full px-3 py-2 bg-slate-50 border rounded-lg text-xs font-semibold"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Klient / Inwestor</label>
                                        <input
                                            type="text"
                                            value={newOrderData.client}
                                            onChange={(e) => setNewOrderData({ ...newOrderData, client: e.target.value })}
                                            placeholder="np. Firma XYZ"
                                            className="w-full px-3 py-2 bg-slate-50 border rounded-lg text-xs font-semibold"
                                        />
                                    </div>

                                    <div className="flex space-x-2 pt-3 border-t">
                                        <button
                                            type="button"
                                            onClick={() => setShowNewOrderModal(false)}
                                            className="w-1/2 py-2 rounded-xl border text-xs font-bold text-slate-600"
                                        >
                                            Anuluj
                                        </button>
                                        <button
                                            type="submit"
                                            className="w-1/2 py-2 rounded-xl bg-indigo-600 text-white font-bold text-xs"
                                        >
                                            Utwórz Zlecenie
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {deleteConfirmTarget && (
                        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl border border-slate-100 text-center space-y-4">
                                <div className="w-12 h-12 bg-rose-100 text-rose-600 rounded-2xl flex items-center justify-center mx-auto text-xl">
                                    <i className="fa-solid fa-trash"></i>
                                </div>
                                <h3 className="font-bold text-slate-900 text-base">Potwierdzenie Usunięcia</h3>
                                <p className="text-xs text-slate-600">
                                    Czy na pewno chcesz usunąć produkt <span className="font-bold">{deleteConfirmTarget.name}</span> z bazy magazynowej?
                                </p>
                                <div className="flex space-x-2 pt-2">
                                    <button
                                        onClick={() => setDeleteConfirmTarget(null)}
                                        className="w-1/2 py-2.5 rounded-xl border border-slate-300 text-xs font-bold text-slate-600"
                                    >
                                        Anuluj
                                    </button>
                                    <button
                                        onClick={() => {
                                            const targetId = deleteConfirmTarget.id;
                                            setProducts(prev => prev.filter(p => p.id !== targetId));
                                            
                                            const fb = window.fb;
                                            if (fb && user) {
                                                fb.deleteDoc(fb.doc(fb.db, 'artifacts', fb.appId, 'public', 'data', 'products', targetId));
                                            }

                                            showNotification(`Usunięto produkt: ${deleteConfirmTarget.name}`, 'success');
                                            setDeleteConfirmTarget(null);
                                        }}
                                        className="w-1/2 py-2.5 rounded-xl bg-rose-600 hover:bg-rose-500 text-white font-bold text-xs shadow-md"
                                    >
                                        Tak, Usuń
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {deleteScanConfirmTarget && (
                        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl border border-slate-100 text-center space-y-4">
                                <div className="w-12 h-12 bg-rose-100 text-rose-600 rounded-2xl flex items-center justify-center mx-auto text-xl">
                                    <i className="fa-solid fa-rotate-left"></i>
                                </div>
                                <h3 className="font-bold text-slate-900 text-base">Potwierdzenie Usunięcia Skanu</h3>
                                <p className="text-xs text-slate-600">
                                    Czy na pewno chcesz usunąć skan pozycji <span className="font-bold">{deleteScanConfirmTarget.productName}</span> ({deleteScanConfirmTarget.quantity} {deleteScanConfirmTarget.unit}) ze zlecenia <span className="font-bold">{deleteScanConfirmTarget.orderCode}</span>?
                                </p>
                                <p className="text-[11px] text-emerald-600 font-semibold bg-emerald-50 py-1.5 px-3 rounded-lg border border-emerald-100">
                                    <i className="fa-solid fa-boxes-stacked mr-1"></i> Ilość towaru zostanie automatycznie zwrócona na stan magazynowy.
                                </p>
                                <div className="flex space-x-2 pt-2">
                                    <button
                                        onClick={() => setDeleteScanConfirmTarget(null)}
                                        className="w-1/2 py-2.5 rounded-xl border border-slate-300 text-xs font-bold text-slate-600"
                                    >
                                        Anuluj
                                    </button>
                                    <button
                                        onClick={() => {
                                            handleUndoAssignmentBoss(deleteScanConfirmTarget.id);
                                            setDeleteScanConfirmTarget(null);
                                        }}
                                        className="w-1/2 py-2.5 rounded-xl bg-rose-600 hover:bg-rose-500 text-white font-bold text-xs shadow-md"
                                    >
                                        Tak, Cofnij Skan
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {resetDataConfirm && (
                        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl border border-slate-100 text-center space-y-4">
                                <div className="w-12 h-12 bg-rose-100 text-rose-600 rounded-2xl flex items-center justify-center mx-auto text-xl">
                                    <i className="fa-solid fa-arrows-rotate"></i>
                                </div>
                                <h3 className="font-bold text-slate-900 text-base">Reset Fabryczny</h3>
                                <p className="text-xs text-slate-600">
                                    Wszystkie dodane produkty, zlecenia oraz skany zostaną zastąpione danymi domyślnymi, a PINy zostaną zresetowane.
                                </p>
                                <div className="flex space-x-2 pt-2">
                                    <button
                                        onClick={() => setResetDataConfirm(false)}
                                        className="w-1/2 py-2.5 rounded-xl border border-slate-300 text-xs font-bold text-slate-600"
                                    >
                                        Anuluj
                                    </button>
                                    <button
                                        onClick={handleExecuteResetData}
                                        className="w-1/2 py-2.5 rounded-xl bg-rose-600 hover:bg-rose-500 text-white font-bold text-xs shadow-md"
                                    >
                                        Resetuj Dane
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
