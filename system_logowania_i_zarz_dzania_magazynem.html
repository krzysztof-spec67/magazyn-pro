<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MagazynPro - System Skanowania i Zarządzania Magazynem</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- JsBarcode CDN for rendering barcodes -->
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <!-- HTML5 QR / Barcode Reader -->
    <script src="https://unpkg.com/html5-qrcode"></script>

    <!-- Cloud Real-time Synchronization Module -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, deleteDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "demo-key",
            authDomain: "demo.firebaseapp.com",
            projectId: "demo-project"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.fb = {
            auth, db,
            signInAnonymously, signInWithCustomToken, onAuthStateChanged,
            doc, setDoc, deleteDoc, onSnapshot, collection,
            appId: typeof __app_id !== 'undefined' ? __app_id : 'magazyn-pro-default',
            initialToken: typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null
        };
    </script>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f1f5f9;
        }
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            body { background: white; color: black; }
        }
        .print-only { display: none; }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #e2e8f0;
        }
        ::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col">
    <div id="root" class="min-h-screen flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // Sygnały dźwiękowe informujące o sukcesie lub błędzie skanu
        const playAudioBeep = (type = 'success') => {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'success') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(587.33, ctx.currentTime);
                    osc.frequency.setValueAtTime(880, ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.start(ctx.currentTime);
                    osc.stop(ctx.currentTime + 0.3);
                } else if (type === 'error') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, ctx.currentTime);
                    osc.frequency.setValueAtTime(160, ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                    osc.start(ctx.currentTime);
                    osc.stop(ctx.currentTime + 0.4);
                } else {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(440, ctx.currentTime);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.05);
                    osc.start(ctx.currentTime);
                    osc.stop(ctx.currentTime + 0.05);
                }
            } catch (e) {
                console.log("Audio feedback disabled", e);
            }
        };

        // Komponent renderujący kody kreskowe CODE128
        function BarcodeVisual({ value, width = 1.8, height = 40, fontSize = 11 }) {
            const svgRef = useRef(null);

            useEffect(() => {
                if (svgRef.current && value && window.JsBarcode) {
                    try {
                        window.JsBarcode(svgRef.current, value, {
                            format: "CODE128",
                            width: width,
                            height: height,
                            displayValue: true,
                            fontSize: fontSize,
                            margin: 5,
                            background: "#ffffff",
                            lineColor: "#000000"
                        });
                    } catch (err) {
                        console.error("Barcode render error:", err);
                    }
                }
            }, [value, width, height, fontSize]);

            return <svg ref={svgRef} className="mx-auto max-w-full"></svg>;
        }

        // Przykładowe dane startowe magazynu i zleceń
        const INITIAL_PRODUCTS = [
            { id: '1', name: 'Wkręty do drewna 4x50mm (100 szt.)', ean: '5901234567890', category: 'Elementy Złączne', price: 18.50, stock: 45, minStock: 10, unit: 'opk' },
            { id: '2', name: 'Profil Aluminiowy U 20x20 2m', ean: '5909876543210', category: 'Profile & Konstrukcje', price: 42.00, stock: 12, minStock: 5, unit: 'szt' },
            { id: '3', name: 'Klej Montażowy Strong 310ml', ean: '5905555444333', category: 'Chemia Budowlana', price: 29.90, stock: 3, minStock: 8, unit: 'szt' },
            { id: '4', name: 'Taśma Malarska Papierowa 48mm/50m', ean: '5901111222333', category: 'Taśmy & Pakowanie', price: 12.00, stock: 80, minStock: 20, unit: 'szt' },
            { id: '5', name: 'Rękawice Robocze Powlekane L', ean: '5907777888999', category: 'BHP', price: 6.50, stock: 150, minStock: 30, unit: 'szt' }
        ];

        const INITIAL_ORDERS = [
            { id: 'ZLEC-2026-001', name: 'Budowa Hal Alfa', client: 'Bud-Mex Sp. z o.o.', status: 'ACTIVE' },
            { id: 'ZLEC-2026-002', name: 'Remont Biura Centralnego', client: 'Omega Logistics', status: 'ACTIVE' },
            { id: 'ZLEC-2026-003', name: 'Montaż Elewacji Budynek B', client: 'Kowalski Construction', status: 'COMPLETED' }
        ];

        const INITIAL_ASSIGNMENTS = [
            { id: 'asg-1', orderCode: 'ZLEC-2026-001', ean: '5901234567890', productName: 'Wkręty do drewna 4x50mm (100 szt.)', quantity: 5, unit: 'opk', price: 18.50, timestamp: '2026-11-24 10:15:30', worker: 'Skaner Magazynier' },
            { id: 'asg-2', orderCode: 'ZLEC-2026-001', ean: '5909876543210', productName: 'Profil Aluminiowy U 20x20 2m', quantity: 2, unit: 'szt', price: 42.00, timestamp: '2026-11-24 10:18:05', worker: 'Skaner Magazynier' }
        ];

        function App() {
            // Blokada wejścia na stronę po otwarciu nowej sesji
            const [isAppUnlocked, setIsAppUnlocked] = useState(() => {
                return sessionStorage.getItem('magazyn_unlocked') === 'true';
            });
            const [accessPinInput, setAccessPinInput] = useState('');
            const [accessPinError, setAccessPinError] = useState('');

            // Role i niezależne kody PIN (do wejścia na stronę oraz do panelu szefa)
            const [role, setRole] = useState('worker'); // 'worker' | 'boss'
            const [appPin, setAppPin] = useState(() => localStorage.getItem('magazyn_app_pin') || '1234');
            const [bossPin, setBossPin] = useState(() => localStorage.getItem('magazyn_boss_pin') || '4321');
            const [isBossAuthenticated, setIsBossAuthenticated] = useState(false);
            const [showPinModal, setShowPinModal] = useState(false);
            const [pinInput, setPinInput] = useState('');
            const [pinError, setPinError] = useState('');

            // Stan synchronizacji z chmurą
            const [user, setUser] = useState(null);
            const [cloudSynced, setCloudSynced] = useState(false);

            // Główne dane aplikacji
            const [products, setProducts] = useState(() => {
                const saved = localStorage.getItem('magazyn_products');
                return saved ? JSON.parse(saved) : INITIAL_PRODUCTS;
            });
            const [orders, setOrders] = useState(() => {
                const saved = localStorage.getItem('magazyn_orders');
                return saved ? JSON.parse(saved) : INITIAL_ORDERS;
            });
            const [assignments, setAssignments] = useState(() => {
                const saved = localStorage.getItem('magazyn_assignments');
                return saved ? JSON.parse(saved) : INITIAL_ASSIGNMENTS;
            });

            // Stan interfejsu skanera pracownika
            const [workerStep, setWorkerStep] = useState(1); // 1 = Wybór zlecenia, 2 = Skanowanie produktów
            const [orderInputText, setOrderInputText] = useState('');
            const [activeOrderCode, setActiveOrderCode] = useState('');
            const [productBarcodeInput, setProductBarcodeInput] = useState('');
            const [matchedProduct, setMatchedProduct] = useState(null);
            const [assignQty, setAssignQty] = useState(1);
            const [bigSuccessBanner, setBigSuccessBanner] = useState(null);
            const [inactivityTimer, setInactivityTimer] = useState(60);
            const [showTestBarcodesWorker, setShowTestBarcodesWorker] = useState(false);

            // Skaner z aparatu
            const [isCameraActive, setIsCameraActive] = useState(false);
            const [cameraScanMode, setCameraScanMode] = useState('order'); // 'order' | 'product'

            // Referencje do automatycznego ustawiania kursora dla czytników kodów
            const orderInputRef = useRef(null);
            const productInputRef = useRef(null);

            // Stan interfejsu panelu szefa
            const [bossTab, setBossTab] = useState('inventory'); // 'inventory' | 'orders' | 'barcodes' | 'settings'
            const [searchTerm, setSearchTerm] = useState('');
            const [categoryFilter, setCategoryFilter] = useState('ALL');
            const [showLowStockOnly, setShowLowStockOnly] = useState(false);
            const [historyOrderFilter, setHistoryOrderFilter] = useState('ALL');
            const [bossOrderStatusFilter, setBossOrderStatusFilter] = useState('ALL'); // 'ALL' | 'ACTIVE' | 'COMPLETED'

            // Podgląd szczegółów konkretnego zlecenia
            const [inspectingOrder, setInspectingOrder] = useState(null);
            const [inspectSearch, setInspectSearch] = useState('');

            // Modale i formularze
            const [showProductModal, setShowProductModal] = useState(false);
            const [editingProduct, setEditingProduct] = useState(null);
            const [formData, setFormData] = useState({
                name: '', ean: '', category: 'Ogólne', price: 0, stock: 10, minStock: 5, unit: 'szt'
            });

            const [showNewOrderModal, setShowNewOrderModal] = useState(false);
            const [newOrderData, setNewOrderData] = useState({ id: '', name: '', client: '' });

            const [showChangePinModal, setShowChangePinModal] = useState(false);
            const [pinTypeToEdit, setPinTypeToEdit] = useState('boss'); // 'app' | 'boss'
            const [pinForm, setPinForm] = useState({ oldPin: '', newPin: '', confirmPin: '' });
            const [changePinError, setChangePinError] = useState('');

            const [deleteConfirmTarget, setDeleteConfirmTarget] = useState(null);
            const [deleteScanConfirmTarget, setDeleteScanConfirmTarget] = useState(null);
            const [resetDataConfirm, setResetDataConfirm] = useState(false);

            // Powiadomienia typu toast
            const [toast, setToast] = useState(null);

            // Logowanie do aplikacji przy otwarciu strony
            const handleAccessPinSubmit = (e) => {
                e.preventDefault();
                if (accessPinInput === appPin) {
                    setIsAppUnlocked(true);
                    sessionStorage.setItem('magazyn_unlocked', 'true');
                    setAccessPinError('');
                    setAccessPinInput('');
                    playAudioBeep('success');
                } else {
                    setAccessPinError('Nieprawidłowy PIN dostępu do strony!');
                    playAudioBeep('error');
                }
            };

            // Wyświetlanie powiadomienia
            const showNotification = (message, type = 'success') => {
                const id = Date.now();
                setToast({ message, type, id });
                playAudioBeep(type);
                setTimeout(() => {
                    setToast(prev => (prev && prev.id === id ? null : prev));
                }, 4000);
            };

            // Przełączanie trybu pracy (Pracownik / Szef)
            const handleRoleSwitch = (targetRole) => {
                if (targetRole === 'boss' && !isBossAuthenticated) {
                    setPinInput('');
                    setPinError('');
                    setShowPinModal(true);
                } else {
                    setRole(targetRole);
                    playAudioBeep('click');
                }
            };

            // Zapis lokalny w pamięci przeglądarki
            useEffect(() => {
                localStorage.setItem('magazyn_products', JSON.stringify(products));
            }, [products]);

            useEffect(() => {
                localStorage.setItem('magazyn_orders', JSON.stringify(orders));
            }, [orders]);

            useEffect(() => {
                localStorage.setItem('magazyn_assignments', JSON.stringify(assignments));
            }, [assignments]);

            useEffect(() => {
                localStorage.setItem('magazyn_app_pin', appPin);
            }, [appPin]);

            useEffect(() => {
                localStorage.setItem('magazyn_boss_pin', bossPin);
            }, [bossPin]);

            // Autoryzacja chmury
            useEffect(() => {
                const fb = window.fb;
                if (!fb) return;

                const initAuth = async () => {
                    try {
                        if (fb.initialToken) {
                            await fb.signInWithCustomToken(fb.auth, fb.initialToken);
                        } else {
                            await fb.signInAnonymously(fb.auth);
                        }
                    } catch (err) {
                        console.warn("Cloud Auth Notice:", err);
                    }
                };

                initAuth();

                const unsubscribeAuth = fb.onAuthStateChanged(fb.auth, (currentUser) => {
                    setUser(currentUser);
                });

                return () => unsubscribeAuth();
            }, []);

            // Nasłuchiwanie zmian w czasie rzeczywistym
            useEffect(() => {
                const fb = window.fb;
                if (!fb || !user) return;

                const appId = fb.appId;
                const basePath = ['artifacts', appId, 'public', 'data'];

                try {
                    const productsColRef = fb.collection(fb.db, ...basePath, 'products');
                    const unsubProducts = fb.onSnapshot(productsColRef, (snapshot) => {
                        if (!snapshot.empty) {
                            const items = snapshot.docs.map(doc => ({ ...doc.data(), id: doc.id }));
                            setProducts(items);
                        }
                        setCloudSynced(true);
                    }, (err) => console.warn("Products sync notice:", err));

                    const ordersColRef = fb.collection(fb.db, ...basePath, 'orders');
                    const unsubOrders = fb.onSnapshot(ordersColRef, (snapshot) => {
                        if (!snapshot.empty) {
                            const items = snapshot.docs.map(doc => ({ ...doc.data(), id: doc.id }));
                            setOrders(items);
                        }
                    }, (err) => console.warn("Orders sync notice:", err));

                    const assignmentsColRef = fb.collection(fb.db, ...basePath, 'assignments');
                    const unsubAssignments = fb.onSnapshot(assignmentsColRef, (snapshot) => {
                        if (!snapshot.empty) {
                            const items = snapshot.docs.map(doc => ({ ...doc.data(), id: doc.id }));
                            items.sort((a, b) => b.id.localeCompare(a.id));
                            setAssignments(items);
                        }
                    }, (err) => console.warn("Assignments sync notice:", err));

                    const configDocRef = fb.doc(fb.db, ...basePath, 'settings', 'config');
                    const unsubConfig = fb.onSnapshot(configDocRef, (snapshot) => {
                        if (snapshot.exists()) {
                            const data = snapshot.data();
                            if (data.appPin) setAppPin(data.appPin);
                            if (data.bossPin) setBossPin(data.bossPin);
                        }
                    }, (err) => console.warn("Config sync notice:", err));

                    return () => {
                        unsubProducts();
                        unsubOrders();
                        unsubAssignments();
                        unsubConfig();
                    };
                } catch (e) {
                    console.warn("Firebase live listener notice:", e);
                }
            }, [user]);

            // Automatyczny powrót do wyboru zlecenia po 60 sekundach bezczynności
            useEffect(() => {
                let timerInterval = null;
                if (role === 'worker' && workerStep === 2) {
                    setInactivityTimer(60);
                    timerInterval = setInterval(() => {
                        setInactivityTimer(prev => {
                            if (prev <= 1) {
                                setWorkerStep(1);
                                setActiveOrderCode('');
                                setProductBarcodeInput('');
                                setMatchedProduct(null);
                                showNotification('Reset z powodu braku aktywności (1 min). Wybierz zlecenie od nowa.', 'error');
                                return 60;
                            }
                            return prev - 1;
                        });
                    }, 1000);
                }

                const resetInactivity = () => {
                    if (role === 'worker' && workerStep === 2) {
                        setInactivityTimer(60);
                    }
                };

                window.addEventListener('mousemove', resetInactivity);
                window.addEventListener('keydown', resetInactivity);
                window.addEventListener('touchstart', resetInactivity);
                window.addEventListener('click', resetInactivity);

                return () => {
                    if (timerInterval) clearInterval(timerInterval);
                    window.removeEventListener('mousemove', resetInactivity);
                    window.removeEventListener('keydown', resetInactivity);
                    window.removeEventListener('touchstart', resetInactivity);
                    window.removeEventListener('click', resetInactivity);
                };
            }, [role, workerStep]);

            // Automatyczne ustawianie kursora na polu skanowania
            useEffect(() => {
                if (role === 'worker' && isAppUnlocked) {
                    if (workerStep === 1 && orderInputRef.current) {
                        orderInputRef.current.focus();
                    } else if (workerStep === 2 && productInputRef.current) {
                        productInputRef.current.focus();
                    }
                }
            }, [role, workerStep, matchedProduct, isAppUnlocked]);

            // Wybór aktywnego zlecenia przez pracownika
            const handleSelectOrder = (orderCode) => {
                const cleaned = orderCode.trim().toUpperCase();
                if (!cleaned) {
                    showNotification('Wpisz lub zeskanuj kod zlecenia!', 'error');
                    return;
                }
                const existing = orders.find(o => o.id.toUpperCase() === cleaned);
                if (!existing) {
                    showNotification(`BŁĄD: Zlecenie "${cleaned}" nie istnieje w systemie! Poproś szefa o jego utworzenie.`, 'error');
                    return;
                }
                if (existing.status === 'COMPLETED') {
                    showNotification(`BŁĄD: Zlecenie "${existing.id}" jest ZAKOŃCZONE!`, 'error');
                    return;
                }
                setActiveOrderCode(existing.id);
                setWorkerStep(2);
                setProductBarcodeInput('');
                setMatchedProduct(null);
                setOrderInputText('');
                showNotification(`Aktywne Zlecenie: ${existing.id} (${existing.name})`, 'success');
            };

            // Dopasowanie produktu po kodzie EAN
            useEffect(() => {
                const cleanedEan = productBarcodeInput.trim();
                if (cleanedEan.length > 0) {
                    const found = products.find(p => p.ean === cleanedEan);
                    if (found) {
                        setMatchedProduct(found);
                        setAssignQty(1);
                    } else {
                        setMatchedProduct(null);
                    }
                } else {
                    setMatchedProduct(null);
                }
            }, [productBarcodeInput, products]);

            // Przypisanie zeskanowanego produktu do zlecenia
            const handleConfirmAssignment = (e) => {
                if (e) e.preventDefault();
                if (!matchedProduct) {
                    showNotification('Nie znaleziono produktu o tym kodzie EAN!', 'error');
                    return;
                }

                if (!activeOrderCode) {
                    showNotification('Najpierw wybierz aktywne zlecenie!', 'error');
                    setWorkerStep(1);
                    return;
                }

                if (assignQty <= 0) {
                    showNotification('Ilość musi być większa niż 0!', 'error');
                    return;
                }

                if (matchedProduct.stock < assignQty) {
                    showNotification(`Brak wystarczającej ilości w magazynie! Stan: ${matchedProduct.stock} ${matchedProduct.unit}`, 'error');
                    return;
                }

                const updatedStock = matchedProduct.stock - Number(assignQty);
                const newAssignment = {
                    id: 'asg-' + Date.now(),
                    orderCode: activeOrderCode,
                    ean: matchedProduct.ean,
                    productName: matchedProduct.name,
                    quantity: Number(assignQty),
                    unit: matchedProduct.unit,
                    price: matchedProduct.price,
                    timestamp: new Date().toLocaleString('pl-PL'),
                    worker: 'Skaner Magazynier'
                };

                setProducts(prevProducts => prevProducts.map(p => {
                    if (p.id === matchedProduct.id) {
                        return { ...p, stock: updatedStock };
                    }
                    return p;
                }));
                setAssignments(prev => [newAssignment, ...prev]);

                const fb = window.fb;
                if (fb && user) {
                    const basePath = ['artifacts', fb.appId, 'public', 'data'];
                    fb.setDoc(fb.doc(fb.db, ...basePath, 'products', matchedProduct.id), {
                        ...matchedProduct,
                        stock: updatedStock
                    });
                    fb.setDoc(fb.doc(fb.db, ...basePath, 'assignments', newAssignment.id), newAssignment);
                }

                playAudioBeep('success');
                setBigSuccessBanner({
                    productName: matchedProduct.name,
                    qty: assignQty,
                    unit: matchedProduct.unit,
                    orderCode: activeOrderCode
                });

                setProductBarcodeInput('');
                setMatchedProduct(null);
                setAssignQty(1);
                setInactivityTimer(60);

                setTimeout(() => {
                    setBigSuccessBanner(null);
                }, 3500);

                if (productInputRef.current) {
                    productInputRef.current.focus();
                }
            };

            // Cofnięcie skanu i zwrot towaru na stan przez szefa
            const handleUndoAssignmentBoss = (assignmentId) => {
                const target = assignments.find(a => a.id === assignmentId);
                if (!target) return;

                const targetProduct = products.find(p => p.ean === target.ean);
                const restoredStock = targetProduct ? targetProduct.stock + target.quantity : 0;

                setProducts(prevProducts => prevProducts.map(p => {
                    if (p.ean === target.ean) {
                        return { ...p, stock: restoredStock };
                    }
                    return p;
                }));

                setAssignments(prev => prev.filter(a => a.id !== assignmentId));

                const fb = window.fb;
                if (fb && user) {
                    const basePath = ['artifacts', fb.appId, 'public', 'data'];
                    if (targetProduct) {
                        fb.setDoc(fb.doc(fb.db, ...basePath, 'products', targetProduct.id), {
                            ...targetProduct,
                            stock: restoredStock
                        });
                    }
                    fb.deleteDoc(fb.doc(fb.db, ...basePath, 'assignments', assignmentId));
                }

                showNotification(`Cofnięto przypisanie ${target.quantity} ${target.unit} do ${target.orderCode}. Stan towaru przywrócony.`, 'success');
            };

            // Szybka korekta stanu +/-
            const handleQuickStockAdjust = (productId, delta) => {
                const target = products.find(p => p.id === productId);
                if (!target) return;

                const newStock = Math.max(0, target.stock + delta);
                setProducts(prev => prev.map(p => p.id === productId ? { ...p, stock: newStock } : p));

                const fb = window.fb;
                if (fb && user) {
                    fb.setDoc(fb.doc(fb.db, 'artifacts', fb.appId, 'public', 'data', 'products', productId), {
                        ...target,
                        stock: newStock
                    });
                }
                playAudioBeep('click');
            };

            // Zmiana statusu zlecenia (Aktywne / Zakończone)
            const handleToggleOrderStatus = (orderId) => {
                const target = orders.find(o => o.id === orderId);
                if (!target) return;

                const newStatus = target.status === 'COMPLETED' ? 'ACTIVE' : 'COMPLETED';

                setOrders(prev => prev.map(o => o.id === orderId ? { ...o, status: newStatus } : o));

                const fb = window.fb;
                if (fb && user) {
                    fb.setDoc(fb.doc(fb.db, 'artifacts', fb.appId, 'public', 'data', 'orders', orderId), {
                        ...target,
                        status: newStatus
                    });
                }

                showNotification(`Zmieniono status zlecenia ${orderId} na: ${newStatus === 'ACTIVE' ? 'Aktywne' : 'Zakończone'}`, 'success');
            };

            // Zapis nowego lub edytowanego produktu
            const handleSaveProduct = (e) => {
                e.preventDefault();
                if (!formData.name.trim() || !formData.ean.trim()) {
                    showNotification('Nazwa i kod EAN są wymagane!', 'error');
                    return;
                }

                const targetId = editingProduct ? editingProduct.id : String(Date.now());
                const prodObj = { ...formData, id: targetId };

                if (editingProduct) {
                    setProducts(prev => prev.map(p => p.id === editingProduct.id ? prodObj : p));
                    showNotification(`Zaktualizowano produkt: ${formData.name}`, 'success');
                } else {
                    if (products.some(p => p.ean === formData.ean)) {
                        showNotification('Produkt z tym kodem EAN już istnieje!', 'error');
                        return;
                    }
                    setProducts(prev => [prodObj, ...prev]);
                    showNotification(`Dodano nowy produkt: ${formData.name}`, 'success');
                }

                const fb = window.fb;
                if (fb && user) {
                    fb.setDoc(fb.doc(fb.db, 'artifacts', fb.appId, 'public', 'data', 'products', targetId), prodObj);
                }

                setShowProductModal(false);
                setEditingProduct(null);
            };

            // Autoryzacja PIN-em do panelu szefa
            const handlePinSubmit = (e) => {
                e.preventDefault();
                if (pinInput === bossPin) {
                    setIsBossAuthenticated(true);
                    setShowPinModal(false);
                    setRole('boss');
                    setPinError('');
                    showNotification('Zalogowano pomyślnie do Panelu Szefa', 'success');
                } else {
                    setPinError('Nieprawidłowy PIN Szefa!');
                    playAudioBeep('error');
                }
            };

            // Dodawanie nowego zlecenia
            const handleSaveNewOrder = (e) => {
                e.preventDefault();
                if (!newOrderData.id.trim() || !newOrderData.name.trim()) {
                    showNotification('Kod i nazwa zlecenia są wymagane!', 'error');
                    return;
                }
                const formattedId = newOrderData.id.toUpperCase().trim();
                if (orders.some(o => o.id === formattedId)) {
                    showNotification('Zlecenie o podanym kodzie już istnieje!', 'error');
                    return;
                }

                const newOrderObj = { ...newOrderData, id: formattedId, status: 'ACTIVE' };
                setOrders(prev => [...prev, newOrderObj]);

                const fb = window.fb;
                if (fb && user) {
                    fb.setDoc(fb.doc(fb.db, 'artifacts', fb.appId, 'public', 'data', 'orders', formattedId), newOrderObj);
                }

                setShowNewOrderModal(false);
                setNewOrderData({ id: '', name: '', client: '' });
                showNotification(`Utworzono nowe aktywne zlecenie ${formattedId}`, 'success');
            };

            // Zmiana kodu PIN
            const handleChangePinSubmit = (e) => {
                e.preventDefault();
                const currentExpectedPin = pinTypeToEdit === 'app' ? appPin : bossPin;
                
                if (pinForm.oldPin !== currentExpectedPin) {
                    setChangePinError('Obecny PIN jest nieprawidłowy!');
                    return;
                }
                if (pinForm.newPin.length < 4) {
                    setChangePinError('Nowy PIN musi mieć co najmniej 4 cyfry!');
                    return;
                }
                if (pinForm.newPin !== pinForm.confirmPin) {
                    setChangePinError('Nowy PIN i powtórzony PIN nie są zgodne!');
                    return;
                }

                if (pinTypeToEdit === 'app') {
                    setAppPin(pinForm.newPin);
                } else {
                    setBossPin(pinForm.newPin);
                }

                const fb = window.fb;
                if (fb && user) {
                    fb.setDoc(fb.doc(fb.db, 'artifacts', fb.appId, 'public', 'data', 'settings', 'config'), {
                        appPin: pinTypeToEdit === 'app' ? pinForm.newPin : appPin,
                        bossPin: pinTypeToEdit === 'boss' ? pinForm.newPin : bossPin
                    });
                }

                setShowChangePinModal(false);
                setPinForm({ oldPin: '', newPin: '', confirmPin: '' });
                setChangePinError('');
                showNotification(`PIN ${pinTypeToEdit === 'app' ? 'Dostępu do Strony' : 'Panelu Szefa'} został zmieniony!`, 'success');
            };

            // Eksport stanu magazynowego do CSV
            const exportInventoryCSV = () => {
                let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
                csvContent += "Kod EAN;Nazwa Produktu;Kategoria;Cena (PLN);Ilość na stanie;Jednostka;Próg alarmowy;Status\n";

                products.forEach(p => {
                    const status = p.stock <= p.minStock ? "NISKI STAN" : "OK";
                    csvContent += `"${p.ean}";"${p.name}";"${p.category}";${p.price};${p.stock};"${p.unit}";${p.minStock};"${status}"\n`;
                });

                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", `Raport_Magazynowy_${new Date().toISOString().slice(0,10)}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showNotification('Pobrano stan magazynowy do pliku CSV', 'success');
            };

            // Eksport historii skanów lub zlecenia do CSV
            const exportOrderCSV = (orderCode = null) => {
                let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
                csvContent += "ID Operacji;Kod Zlecenia;Kod EAN;Nazwa Produktu;Przypisana Ilość;Jednostka;Cena Jedn.;Wartość;Data i Czas;Magazynier\n";

                const listToExport = orderCode 
                    ? assignments.filter(a => a.orderCode === orderCode)
                    : assignments;

                listToExport.forEach(a => {
                    const totalVal = ((a.price || 0) * a.quantity).toFixed(2);
                    csvContent += `"${a.id}";"${a.orderCode}";"${a.ean}";"${a.productName}";${a.quantity};"${a.unit}";${a.price || 0};${totalVal};"${a.timestamp}";"${a.worker}"\n`;
                });

                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                const filename = orderCode ? `Zlecenie_${orderCode}_${new Date().toISOString().slice(0,10)}.csv` : `Wywoz_Wszystkie_Zlecenia_${new Date().toISOString().slice(0,10)}.csv`;
                link.setAttribute("download", filename);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showNotification(`Pobrano plik CSV ${orderCode ? 'dla zlecenia ' + orderCode : ''}`, 'success');
            };

            // Przywrócenie ustawień i danych domyślnych
            const handleExecuteResetData = () => {
                localStorage.removeItem('magazyn_products');
                localStorage.removeItem('magazyn_orders');
                localStorage.removeItem('magazyn_assignments');
                localStorage.removeItem('magazyn_app_pin');
                localStorage.removeItem('magazyn_boss_pin');
                setProducts(INITIAL_PRODUCTS);
                setOrders(INITIAL_ORDERS);
                setAssignments(INITIAL_ASSIGNMENTS);
                setAppPin('1234');
                setBossPin('4321');
                setResetDataConfirm(false);
                showNotification('Przywrócono ustawienia i dane domyślne.', 'success');
            };

            // Filtrowanie aktywnych zleceń w panelu pracownika
            const matchingActiveOrders = useMemo(() => {
                const activeOnly = orders.filter(o => o.status !== 'COMPLETED');
                if (!orderInputText.trim()) return activeOnly;
                const query = orderInputText.trim().toLowerCase();
                return activeOnly.filter(o => 
                    o.id.toLowerCase().includes(query) ||
                    o.name.toLowerCase().includes(query) ||
                    (o.client && o.client.toLowerCase().includes(query))
                );
            }, [orders, orderInputText]);

            // Filtrowanie magazynu w panelu szefa
            const filteredProducts = useMemo(() => {
                return products.filter(p => {
                    const matchesSearch = p.name.toLowerCase().includes(searchTerm.toLowerCase()) || 
                                          p.ean.includes(searchTerm) || 
                                          p.category.toLowerCase().includes(searchTerm.toLowerCase());
                    const matchesCategory = categoryFilter === 'ALL' || p.category === categoryFilter;
                    const matchesLowStock = !showLowStockOnly || p.stock <= p.minStock;
                    return matchesSearch && matchesCategory && matchesLowStock;
                });
            }, [products, searchTerm, categoryFilter, showLowStockOnly]);

            const categoriesList = useMemo(() => {
                return Array.from(new Set(products.map(p => p.category)));
            }, [products]);

            const lowStockCount = useMemo(() => {
                return products.filter(p => p.stock <= p.minStock).length;
            }, [products]);

            // Podsumowanie każdego zlecenia
            const ordersSummaryList = useMemo(() => {
                return orders.map(ord => {
                    const ordAssignments = assignments.filter(a => a.orderCode === ord.id);
                    const totalItemsCount = ordAssignments.reduce((acc, curr) => acc + curr.quantity, 0);
                    const uniqueSKUs = new Set(ordAssignments.map(a => a.ean)).size;
                    const totalValue = ordAssignments.reduce((acc, curr) => acc + ((curr.price || 0) * curr.quantity), 0);
                    const lastActivity = ordAssignments.length > 0 ? ordAssignments[0].timestamp : 'Brak skanów';
                    
                    return {
                        ...ord,
                        totalItemsCount,
                        uniqueSKUs,
                        totalValue,
                        lastActivity,
                        assignmentsCount: ordAssignments.length
                    };
                });
            }, [orders, assignments]);

            const filteredOrdersSummaryList = useMemo(() => {
                return ordersSummaryList.filter(ord => {
                    if (bossOrderStatusFilter === 'ACTIVE') return ord.status === 'ACTIVE';
                    if (bossOrderStatusFilter === 'COMPLETED') return ord.status === 'COMPLETED';
                    return true;
                });
            }, [ordersSummaryList, bossOrderStatusFilter]);

            // Obsługa skanowania kodów z aparatu
            useEffect(() => {
                let html5QrCode = null;
                if (isCameraActive) {
                    html5QrCode = new Html5Qrcode("reader-camera");
                    const config = { fps: 10, qrbox: { width: 260, height: 160 } };
                    
                    html5QrCode.start(
                        { facingMode: "environment" },
                        config,
                        (decodedText) => {
                            if (cameraScanMode === 'order') {
                                handleSelectOrder(decodedText);
                                showNotification(`Zeskanowano kod zlecenia: ${decodedText}`, 'success');
                            } else {
                                setProductBarcodeInput(decodedText);
                                showNotification(`Zeskanowano produkt: ${decodedText}`, 'success');
                            }
                            setIsCameraActive(false);
                        },
                        () => {}
                    ).catch(err => {
                        console.error("Camera start error:", err);
                        setIsCameraActive(false);
                        showNotification('Nie udało się uruchomić kamery.', 'error');
                    });
                }

                return () => {
                    if (html5QrCode && html5QrCode.isScanning) {
                        html5QrCode.stop().catch(err => console.error(err));
                    }
                };
            }, [isCameraActive, cameraScanMode]);

            // Ekran logowania przy wejściu na stronę
            if (!isAppUnlocked) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-slate-950 p-4">
                        <div className="bg-white rounded-3xl max-w-md w-full p-8 shadow-2xl space-y-6 border border-slate-800 text-center">
                            <div className="w-20 h-20 bg-indigo-600 text-white rounded-3xl flex items-center justify-center mx-auto text-3xl shadow-lg shadow-indigo-200">
                                <i className="fa-solid fa-boxes-stacked"></i>
                            </div>
                            <div>
                                <h2 className="text-2xl font-black text-slate-900">MagazynPro</h2>
                                <p className="text-xs text-slate-500 mt-1">System Skanowania & Zarządzania Magazynem</p>
                            </div>
                            <form onSubmit={handleAccessPinSubmit} className="space-y-4">
                                <div>
                                    <label className="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">
                                        Wpisz PIN Dostępu do Strony
                                    </label>
                                    <input
                                        type="password"
                                        maxLength="10"
                                        value={accessPinInput}
                                        onChange={(e) => setAccessPinInput(e.target.value)}
                                        placeholder="Wpisz PIN Strony"
                                        className="w-full text-center text-3xl font-mono font-bold tracking-widest py-4 bg-slate-50 border-2 border-slate-300 rounded-2xl focus:border-indigo-600 focus:bg-white focus:outline-none transition-all shadow-inner"
                                        autoFocus
                                    />
                                </div>
                                {accessPinError && (
                                    <p className="text-xs font-bold text-rose-600 bg-rose-50 py-2.5 rounded-xl border border-rose-200">
                                        <i className="fa-solid fa-triangle-exclamation mr-1.5"></i>
                                        {accessPinError}
                                    </p>
                                )}
                                <button
                                    type="submit"
                                    className="w-full py-4 bg-indigo-600 hover:bg-indigo-500 text-white font-extrabold text-base rounded-2xl shadow-lg shadow-indigo-200 active:scale-98 transition-all flex items-center justify-center space-x-2"
                                >
                                    <i className="fa-solid fa-key"></i>
                                    <span>WEJDŹ DO SYSTEMU</span>
                                </button>
                            </form>
                            <div className="text-[11px] text-slate-400 border-t border-slate-100 pt-4 flex items-center justify-center space-x-1">
                                <i className="fa-solid fa-shield-halved text-emerald-500"></i>
                                <span>Autoryzowany dostęp magazynowy</span>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen flex flex-col bg-slate-100">
                    {/* Górny pasek nawigacji */}
                    <header className="bg-slate-900 text-white shadow-md sticky top-0 z-40 no-print">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                            <div className="flex items-center space-x-3">
                                <div className="bg-indigo-600 p-2 rounded-xl flex items-center justify-center text-white text-lg">
                                    <i className="fa-solid fa-boxes-stacked"></i>
                                </div>
                                <div>
                                    <div className="flex items-center space-x-2">
                                        <h1 className="font-extrabold text-lg tracking-tight leading-none text-white">MagazynPro</h1>
                                        {cloudSynced ? (
                                            <span className="bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 font-bold text-[10px] px-2 py-0.5 rounded-full flex items-center space-x-1" title="Automatyczna synchronizacja na żywo aktywna">
                                                <i className="fa-solid fa-cloud text-[9px] animate-pulse"></i>
                                                <span>Chmura Live</span>
                                            </span>
                                        ) : (
                                            <span className="bg-amber-500/20 text-amber-400 border border-amber-500/30 font-bold text-[10px] px-2 py-0.5 rounded-full flex items-center space-x-1">
                                                <i className="fa-solid fa-spinner fa-spin text-[9px]"></i>
                                                <span>Łączenie...</span>
                                            </span>
                                        )}
                                    </div>
                                    <p className="text-[11px] text-slate-400">System Skanowania Kodów & Zarządzania</p>
                                </div>
                            </div>

                            {/* Przełącznik trybu pracy i przycisk blokady */}
                            <div className="flex items-center space-x-3">
                                <div className="bg-slate-800 p-1 rounded-xl flex border border-slate-700">
                                    <button
                                        onClick={() => handleRoleSwitch('worker')}
                                        className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center space-x-2 ${
                                            role === 'worker' 
                                                ? 'bg-emerald-600 text-white shadow-sm' 
                                                : 'text-slate-400 hover:text-white'
                                        }`}
                                    >
                                        <i className="fa-solid fa-barcode"></i>
                                        <span>SKANER PRACOWNIKA</span>
                                    </button>
                                    <button
                                        onClick={() => handleRoleSwitch('boss')}
                                        className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center space-x-2 ${
                                            role === 'boss' 
                                                ? 'bg-amber-600 text-white shadow-sm' 
                                                : 'text-slate-400 hover:text-white'
                                        }`}
                                    >
                                        <i className="fa-solid fa-user-shield"></i>
                                        <span>PANEL SZEFA</span>
                                        {!isBossAuthenticated && <i className="fa-solid fa-lock text-[10px] text-amber-300"></i>}
                                    </button>
                                </div>

                                <button
                                    onClick={() => {
                                        sessionStorage.removeItem('magazyn_unlocked');
                                        setIsAppUnlocked(false);
                                        setIsBossAuthenticated(false);
                                    }}
                                    className="bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white p-2.5 rounded-xl border border-slate-700 text-xs font-bold flex items-center space-x-1.5 transition-colors"
                                    title="Zablokuj stronę"
                                >
                                    <i className="fa-solid fa-lock text-amber-400"></i>
                                    <span className="hidden md:inline">Zablokuj</span>
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* Powiadomienie toast */}
                    {toast && (
                        <div className="fixed bottom-5 right-5 z-50 max-w-md w-full no-print">
                            <div className={`p-4 rounded-xl shadow-2xl border flex items-center justify-between space-x-3 ${
                                toast.type === 'error'
                                    ? 'bg-rose-900 border-rose-700 text-rose-100'
                                    : 'bg-emerald-900 border-emerald-700 text-emerald-100'
                            }`}>
                                <div className="flex items-center space-x-3">
                                    <i className={`fa-solid text-2xl ${toast.type === 'error' ? 'fa-triangle-exclamation text-rose-400' : 'fa-circle-check text-emerald-400'}`}></i>
                                    <p className="text-sm font-semibold">{toast.message}</p>
                                </div>
                                <button onClick={() => setToast(null)} className="text-slate-300 hover:text-white">
                                    <i className="fa-solid fa-xmark"></i>
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Zawartość główna */}
                    <main className="flex-grow max-w-7xl w-full mx-auto p-4 sm:p-6">

                        {/* PANEL PRACOWNIKA */}
                        {role === 'worker' && (
                            <div className="max-w-2xl mx-auto space-y-6">
                                
                                <div className="bg-slate-900 text-white rounded-2xl p-4 shadow-md flex items-center justify-between">
                                    <div className="flex items-center space-x-3">
                                        <div className={`w-9 h-9 rounded-full font-extrabold flex items-center justify-center text-sm ${
                                            workerStep === 1 ? 'bg-amber-500 text-slate-950' : 'bg-emerald-500 text-slate-950'
                                        }`}>
                                            {workerStep === 1 ? '1' : '2'}
                                        </div>
                                        <div>
                                            <span className="text-[10px] uppercase font-bold tracking-wider text-slate-400">
                                                {workerStep === 1 ? 'Krok 1 z 2: Wybór Zlecenia' : 'Krok 2 z 2: Skanowanie Produktów'}
                                            </span>
                                            <h2 className="text-base font-bold">
                                                {workerStep === 1 ? 'Wskaż Aktywne Zlecenie' : `Zlecenie: ${activeOrderCode}`}
                                            </h2>
                                        </div>
                                    </div>

                                    {workerStep === 2 && (
                                        <div className="flex items-center space-x-2">
                                            <span className="text-[11px] font-mono font-bold bg-slate-800 text-amber-300 px-2.5 py-1.5 rounded-xl border border-slate-700 flex items-center space-x-1.5" title="Czas do automatycznego powrotu po bezczynności">
                                                <i className="fa-regular fa-clock"></i>
                                                <span>{inactivityTimer}s</span>
                                            </span>
                                            <button
                                                onClick={() => {
                                                    setWorkerStep(1);
                                                    playAudioBeep('click');
                                                }}
                                                className="bg-slate-800 hover:bg-slate-700 text-xs text-slate-200 font-bold px-3 py-1.5 rounded-xl border border-slate-700 flex items-center space-x-1.5"
                                            >
                                                <i className="fa-solid fa-arrows-rotate"></i>
                                                <span>Zmień Zlecenie</span>
                                            </button>
                                        </div>
                                    )}
                                </div>

                                {bigSuccessBanner && (
                                    <div className="bg-emerald-600 text-white p-6 rounded-2xl shadow-xl text-center space-y-2 animate-bounce">
                                        <div className="w-12 h-12 bg-white text-emerald-600 rounded-full flex items-center justify-center mx-auto text-2xl font-bold">
                                            <i className="fa-solid fa-check"></i>
                                        </div>
                                        <h3 className="text-xl font-extrabold">PRZYPISANO DO ZLECENIA!</h3>
                                        <p className="text-emerald-100 text-base font-semibold">
                                            +{bigSuccessBanner.qty} {bigSuccessBanner.unit} [{bigSuccessBanner.productName}] ➔ <span className="underline font-bold">{bigSuccessBanner.orderCode}</span>
                                        </p>
                                    </div>
                                )}

                                {/* Krok 1: Wybór zlecenia */}
                                {workerStep === 1 && (
                                    <div className="bg-white rounded-3xl p-6 sm:p-8 shadow-sm border border-slate-200 space-y-6">
                                        <div className="text-center space-y-2">
                                            <div className="w-16 h-16 bg-amber-50 text-amber-600 rounded-2xl flex items-center justify-center mx-auto text-3xl">
                                                <i className="fa-solid fa-barcode"></i>
                                            </div>
                                            <h3 className="text-xl font-bold text-slate-900">Zeskanuj lub Wpisz Kod Zlecenia</h3>
                                            <p className="text-xs text-slate-500">
                                                Zeskanuj kod zlecenia albo zacznij wpisywać jego numer lub nazwę – podpowiedzi pojawią się automatycznie.
                                            </p>
                                        </div>

                                        {isCameraActive && cameraScanMode === 'order' && (
                                            <div className="bg-slate-900 p-4 rounded-2xl text-center text-white">
                                                <p className="text-xs text-slate-300 mb-2">Skieruj aparat na kod kreskowy zlecenia</p>
                                                <div id="reader-camera" className="w-full max-w-sm mx-auto overflow-hidden rounded-xl"></div>
                                                <button
                                                    onClick={() => setIsCameraActive(false)}
                                                    className="mt-3 px-4 py-1.5 bg-rose-600 text-xs font-bold rounded-lg"
                                                >
                                                    Zamknij Kamerę
                                                </button>
                                            </div>
                                        )}

                                        <div className="space-y-3">
                                            <form onSubmit={(e) => { e.preventDefault(); handleSelectOrder(orderInputText); }} className="space-y-4">
                                                <div className="relative">
                                                    <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                                                        <i className="fa-solid fa-magnifying-glass text-lg"></i>
                                                    </div>
                                                    <input
                                                        ref={orderInputRef}
                                                        type="text"
                                                        value={orderInputText}
                                                        onChange={(e) => setOrderInputText(e.target.value)}
                                                        placeholder="Zacznij pisać kod lub nazwę zlecenia..."
                                                        className="w-full pl-12 pr-12 py-4 bg-slate-50 border-2 border-amber-300 focus:border-amber-500 rounded-2xl text-slate-900 font-mono font-bold text-base focus:bg-white focus:outline-none transition-all shadow-inner"
                                                        autoFocus
                                                    />
                                                    <button
                                                        type="button"
                                                        onClick={() => {
                                                            setCameraScanMode('order');
                                                            setIsCameraActive(true);
                                                        }}
                                                        className="absolute inset-y-0 right-0 pr-4 flex items-center text-amber-600 hover:text-amber-800"
                                                        title="Uruchom skaner kamery"
                                                    >
                                                        <i className="fa-solid fa-camera text-xl"></i>
                                                    </button>
                                                </div>
